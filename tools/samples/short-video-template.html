<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>縦型ショート動画テンプレート（書き出し用）</title>
<!-- Sumi Web 自主制作サンプル：架空のカフェ「Blueberry Terrace」の商品紹介動画。render-video.js が window.render(秒) を呼び、1フレームずつ書き出します。 -->
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{font-family:"IPAPGothic","IPAGothic",sans-serif;background:#183765;color:#fff;position:relative}
  .abs{position:absolute}
  .layer{position:absolute;inset:0;overflow:hidden}
  .shade{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(180deg,rgba(24,55,101,0),rgba(24,55,101,.92) 60%)}
  #store{height:1920px;width:2880px;left:0;top:0;transform-origin:0 0}
  #latte{width:1920px;height:1920px;left:-420px;top:0;transform-origin:50% 60%}
  .brand{left:0;right:0;top:110px;text-align:center;z-index:5}
  .brand span{display:inline-block;background:rgba(255,255,255,.94);color:#183765;font-family:Georgia,serif;font-size:50px;letter-spacing:.04em;padding:14px 46px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .brand i{color:#3975c6}
  .intro{left:80px;bottom:330px;font-size:118px;line-height:1.35;font-weight:bold;text-shadow:0 4px 24px rgba(0,0,0,.35)}
  .intro span{display:block}
  .intro small{display:block;font-size:42px;color:#bcd4f5;letter-spacing:.2em;margin-bottom:24px}
  .name{left:80px;right:80px;bottom:330px}
  .badge{display:inline-block;background:#6c5fc0;color:#fff;font-size:44px;letter-spacing:.14em;padding:12px 40px;border-radius:999px}
  .name h1{font-size:118px;line-height:1.2;margin-top:28px;text-shadow:0 4px 24px rgba(0,0,0,.35)}
  .points{left:80px;right:80px;bottom:300px;display:grid;gap:28px}
  .points p{background:rgba(255,255,255,.95);color:#183765;border-radius:28px;padding:28px 40px;font-size:52px;font-weight:bold;box-shadow:0 18px 40px rgba(0,0,0,.2);display:flex;align-items:center;gap:26px}
  .points b{flex:none;width:72px;height:72px;border-radius:50%;background:#183765;color:#fff;display:grid;place-items:center;font-size:36px;font-family:Georgia,serif}
  #endbg{background:#183765}
  .ring{width:760px;height:760px;border-radius:50%;border:90px solid #3975c6;right:-320px;top:-240px;opacity:.8}
  .thumb{left:240px;top:290px;width:600px;height:600px;border-radius:40px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.35)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .end{left:90px;right:90px;top:960px;background:#fff;color:#183765;border-radius:40px;padding:56px 64px}
  .end .t{font-size:46px;color:#3975c6;letter-spacing:.06em}
  .end .p{display:flex;align-items:flex-end;gap:18px;margin-top:10px}
  .end .p b{font-family:Georgia,serif;font-size:190px;line-height:.9}
  .end .p span{font-size:54px}
  .end .d{font-size:46px;margin-top:30px;border-top:2px solid #dce5f0;padding-top:26px}
  .end .h{font-size:36px;color:#5d6b80;margin-top:8px}
  .note{left:0;right:0;bottom:70px;text-align:center;font-size:32px;z-index:5}
  .note span{background:rgba(255,255,255,.88);color:#3b4a62;padding:10px 30px;border-radius:999px}
</style>
</head>
<body>
  <div class="layer" id="s1">
    <img class="abs" id="store" src="../../samples/cafe/images/storefront.webp" alt="">
    <div class="shade"></div>
    <div class="abs intro">
      <small id="i0">SUMMER LIMITED</small>
      <span id="i1">初夏の新作、</span>
      <span id="i2">できました。</span>
    </div>
  </div>

  <div class="layer" id="s2">
    <img class="abs" id="latte" src="../../samples/cafe/images/blueberry-latte.webp" alt="">
    <div class="shade"></div>
    <div class="abs name" id="name">
      <p class="badge">季節限定 NEW</p>
      <h1>ブルーベリー<br>ミルクラテ</h1>
    </div>
    <div class="abs points" id="points">
      <p id="p1"><b>1</b>自家製ブルーベリーソース</p>
      <p id="p2"><b>2</b>混ぜるほど色が変わる</p>
      <p id="p3"><b>3</b>アイスのみ・数量限定</p>
    </div>
  </div>

  <div class="layer" id="s3">
    <div class="layer" id="endbg"></div>
    <div class="abs ring" id="ring"></div>
    <div class="abs thumb" id="thumb"><img src="../../samples/cafe/images/blueberry-latte.webp" alt=""></div>
    <div class="abs end" id="end">
      <p class="t">ブルーベリーミルクラテ</p>
      <p class="p"><b>680</b><span>円（税込）</span></p>
      <p class="d">販売期間 6.1 — 8.31</p>
      <p class="h">Blueberry Terrace ／ 9:00〜18:00（水曜定休）</p>
    </div>
  </div>

  <p class="abs brand" id="brand"><span>Blueberry <i>Terrace</i></span></p>
  <p class="abs note"><span>Sumi Web 自主制作サンプル｜架空の店舗・イメージ画像です</span></p>

<script>
const $ = id => document.getElementById(id);
const clamp = x => Math.min(1, Math.max(0, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => ease((t - a) / (b - a));
// 区間 [a,b] でフェードイン、[c,d] でフェードアウト
const show = (el, t, a, b, c, d, dy = 60) => {
  const k = seg(t, a, b) * (1 - seg(t, c, d));
  el.style.opacity = k;
  el.style.transform = `translateY(${(1 - seg(t, a, b)) * dy - seg(t, c, d) * dy}px)`;
};
window.render = t => {
  // 場面1（0〜3.4秒）：店舗外観を看板からポスターへ横に流す
  $('store').style.transform = `translateX(${-700 - smooth(t / 3.6) * 1100}px)`;
  $('s1').style.opacity = 1;
  show($('i0'), t, 0.2, 0.8, 2.8, 3.2);
  show($('i1'), t, 0.4, 1.1, 2.8, 3.2, 90);
  show($('i2'), t, 0.8, 1.5, 2.8, 3.2, 90);

  // 場面2（3.2〜11秒）：商品写真をゆっくりズーム。後半はソースに寄る
  $('s2').style.opacity = smooth((t - 3.0) / 0.5);
  const zoom = 1 + smooth((t - 3.0) / 4) * 0.06 + smooth((t - 6.8) / 1.2) * 0.3;
  const down = smooth((t - 6.8) / 1.2) * -260;
  $('latte').style.transform = `translateY(${down}px) scale(${zoom})`;
  show($('name'), t, 3.6, 4.3, 6.5, 6.9);
  show($('p1'), t, 7.1, 7.6, 10.6, 11.0);
  show($('p2'), t, 8.0, 8.5, 10.6, 11.0);
  show($('p3'), t, 8.9, 9.4, 10.6, 11.0);

  // 場面3（11秒〜）：価格と販売期間で締め
  $('s3').style.opacity = smooth((t - 10.8) / 0.5);
  $('ring').style.transform = `rotate(${t * 18}deg)`;
  const pop = seg(t, 11.0, 11.8);
  $('thumb').style.transform = `scale(${0.85 + pop * 0.15})`;
  show($('end'), t, 11.4, 12.2, 99, 100, 120);
  show($('brand'), t, 3.3, 3.9, 99, 100, 30);
};
window.render(0);
</script>
</body>
</html>
