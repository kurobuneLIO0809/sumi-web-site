<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>縦型ショート動画テンプレート（書き出し用）</title>
<!-- Sumi Web 自主制作サンプル：架空のカフェ「Café Aoiro」の商品紹介動画。render-video.js が window.render(秒) を呼び、1フレームずつ書き出します。 -->
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{font-family:"IPAPGothic","IPAGothic",sans-serif;background:#e8f1fc;color:#183765;position:relative}
  .abs{position:absolute}
  .ring{width:760px;height:760px;border-radius:50%;border:90px solid #3975c6;border-right-color:#6f9ee0;right:-300px;top:-260px}
  .ring2{width:420px;height:420px;border-radius:50%;border:56px solid #c9daf3;left:-200px;bottom:260px}
  .brand{left:0;right:0;top:120px;text-align:center;font-family:Georgia,serif;font-size:52px;letter-spacing:.08em}
  .brand i{color:#3975c6}
  .brand span{display:inline-block;background:#fff;padding:14px 48px;border-radius:999px;box-shadow:0 10px 30px rgba(24,55,101,.12)}
  .intro{left:90px;top:520px;font-size:120px;line-height:1.35;font-weight:bold}
  .intro span{display:block}
  .intro small{display:block;font-size:44px;color:#3975c6;letter-spacing:.2em;margin-bottom:28px}
  .stage{left:240px;top:360px;width:600px;height:780px;transform-origin:50% 100%}
  .stage svg{width:100%;height:100%;overflow:visible}
  .name{left:0;right:0;top:1230px;text-align:center}
  .badge{display:inline-block;background:#4a4ea8;color:#fff;font-size:44px;letter-spacing:.14em;padding:12px 40px;border-radius:999px}
  .name h1{font-size:108px;line-height:1.2;margin-top:30px}
  .points{left:110px;right:110px;top:1240px;display:grid;gap:30px}
  .points p{background:#fff;border-radius:28px;padding:30px 40px;font-size:52px;font-weight:bold;box-shadow:0 18px 40px rgba(24,55,101,.12);display:flex;align-items:center;gap:26px}
  .points b{flex:none;width:72px;height:72px;border-radius:50%;background:#183765;color:#fff;display:grid;place-items:center;font-size:36px;font-family:Georgia,serif}
  .end{left:90px;right:90px;top:1000px;background:#183765;color:#fff;border-radius:40px;padding:60px 64px;box-shadow:0 30px 60px rgba(24,55,101,.25)}
  .end .t{font-size:46px;color:#bcd4f5;letter-spacing:.1em}
  .end .p{display:flex;align-items:flex-end;gap:18px;margin-top:10px}
  .end .p b{font-family:Georgia,serif;font-size:190px;line-height:.9}
  .end .p span{font-size:54px}
  .end .d{font-size:46px;margin-top:30px;border-top:2px solid rgba(255,255,255,.25);padding-top:26px}
  .end .h{font-size:38px;color:#bcd4f5;margin-top:8px}
  .note{left:0;right:0;bottom:70px;text-align:center;font-size:34px;color:#5d6b80}
  .note span{background:rgba(255,255,255,.85);padding:10px 30px;border-radius:999px}
</style>
</head>
<body>
  <div class="abs ring" id="ring"></div>
  <div class="abs ring2"></div>
  <p class="abs brand" id="brand"><span>Café <i>Aoiro</i></span></p>

  <div class="abs intro" id="intro">
    <small id="i0">SUMMER LIMITED</small>
    <span id="i1">初夏の新作、</span>
    <span id="i2">できました。</span>
  </div>

  <div class="abs stage" id="stage">
    <svg viewBox="0 0 400 520" aria-hidden="true">
      <defs>
        <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f4fc"/><stop offset=".55" stop-color="#d9d4f1"/><stop offset="1" stop-color="#a99fdc"/></linearGradient>
        <linearGradient id="sauce" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c5fc0"/><stop offset="1" stop-color="#3d3486"/></linearGradient>
        <clipPath id="cup"><path d="M92 150h216l-22 320a24 24 0 0 1-24 22H138a24 24 0 0 1-24-22z"/></clipPath>
      </defs>
      <ellipse cx="200" cy="500" rx="140" ry="14" fill="#183765" opacity=".12"/>
      <g id="straw"><rect x="236" y="30" width="16" height="200" rx="8" transform="rotate(12 244 130)" fill="#183765"/><rect x="236" y="30" width="16" height="40" rx="8" transform="rotate(12 244 130)" fill="#3975c6"/></g>
      <g clip-path="url(#cup)">
        <rect x="80" y="150" width="240" height="360" fill="url(#milk)"/>
        <path id="wave2" d="M-160 330c30-10 50 22 86 6s58-24 94-4 40 6 60 0c30-10 50 22 86 6s58-24 94-4 40 6 60 0c30-10 50 22 86 6s58-24 94-4 40 6 60 0v260H-160z" fill="#8f84d3" opacity=".55"/>
        <path id="wave1" d="M-160 400c40-18 80 14 120-2s80-20 120 0c40-18 80 14 120-2s80-20 120 0c40-18 80 14 120-2s80-20 120 0v260H-160z" fill="url(#sauce)"/>
        <rect x="80" y="150" width="240" height="46" fill="#fff"/>
      </g>
      <path d="M92 150h216l-22 320a24 24 0 0 1-24 22H138a24 24 0 0 1-24-22z" fill="none" stroke="#183765" stroke-width="6" stroke-linejoin="round"/>
      <path d="M124 186l14 262" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".7"/>
      <path d="M84 150c10-34 50-46 76-30 14-26 64-30 84-4 30-14 66 4 72 34z" fill="#fff" stroke="#183765" stroke-width="6" stroke-linejoin="round"/>
      <g id="b1"><circle cx="160" cy="118" r="20" fill="#3b3f8f" stroke="#183765" stroke-width="4"/><circle cx="153" cy="111" r="5" fill="#fff" opacity=".8"/></g>
      <g id="b2"><circle cx="198" cy="104" r="22" fill="#4a4ea8" stroke="#183765" stroke-width="4"/><circle cx="190" cy="96" r="5" fill="#fff" opacity=".8"/></g>
      <g id="b3"><circle cx="236" cy="120" r="19" fill="#34387f" stroke="#183765" stroke-width="4"/><circle cx="229" cy="113" r="4" fill="#fff" opacity=".8"/></g>
      <path id="leaf" d="M250 96c20-30 52-30 62-24-6 28-36 40-62 24z" fill="#6aa98a" stroke="#183765" stroke-width="4" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="abs name" id="name">
    <p class="badge">季節限定 NEW</p>
    <h1>ブルーベリー<br>ミルクラテ</h1>
  </div>

  <div class="abs points" id="points">
    <p id="p1"><b>1</b>自家製ブルーベリーソース</p>
    <p id="p2"><b>2</b>混ぜるほど色が変わる</p>
    <p id="p3"><b>3</b>アイスのみ・数量限定</p>
  </div>

  <div class="abs end" id="end">
    <p class="t">ブルーベリーミルクラテ</p>
    <p class="p"><b>680</b><span>円（税込）</span></p>
    <p class="d">販売期間 6.1 — 8.31</p>
    <p class="h">Café Aoiro ／ 9:00〜18:00（水曜定休）</p>
  </div>

  <p class="abs note"><span>Sumi Web 自主制作サンプル｜架空の店舗です</span></p>

<script>
const $ = id => document.getElementById(id);
const clamp = x => Math.min(1, Math.max(0, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const seg = (t, a, b) => ease((t - a) / (b - a));
// 区間 [a,b] でフェードイン、[c,d] でフェードアウト
const show = (el, t, a, b, c, d, dy = 60) => {
  const k = seg(t, a, b) * (1 - seg(t, c, d));
  el.style.opacity = k;
  el.style.transform = `translateY(${(1 - seg(t, a, b)) * dy - seg(t, c, d) * dy}px)`;
};
window.render = t => {
  $('ring').style.transform = `rotate(${t * 18}deg)`;
  show($('brand'), t, 0, 0.6, 99, 100, 30);
  show($('i0'), t, 0.2, 0.8, 2.7, 3.1);
  show($('i1'), t, 0.4, 1.1, 2.7, 3.1, 90);
  show($('i2'), t, 0.8, 1.5, 2.7, 3.1, 90);

  // カップ：下から登場 → ゆらぎ → 最後に上へ縮小
  const enter = seg(t, 2.9, 3.9), shrink = seg(t, 10.8, 11.8);
  const bob = Math.sin(t * 2.2) * 8;
  $('stage').style.opacity = clamp((t - 2.9) / 0.4);
  $('stage').style.transform = `translateY(${(1 - enter) * 1100 + bob - shrink * 230}px) scale(${1 - shrink * 0.32})`;
  [['b1', 3.7], ['b2', 3.95], ['b3', 4.2]].forEach(([id, s]) => {
    const k = seg(t, s, s + 0.45);
    $(id).style.opacity = clamp((t - s) / 0.15);
    $(id).style.transform = `translateY(${(1 - k) * -260}px)`;
  });
  $('leaf').style.opacity = seg(t, 4.5, 4.9);
  // 「混ぜると色が変わる」場面でソースが大きく揺れる
  const mix = seg(t, 8.0, 8.6) * (1 - seg(t, 10.2, 10.8));
  const sway = 60 + mix * 50;
  $('wave1').style.transform = `translate(${(t * sway) % 240}px, ${-mix * 70}px)`;
  $('wave2').style.transform = `translate(${-(t * sway * 0.8) % 240}px, ${-mix * 40}px)`;

  show($('name'), t, 4.4, 5.1, 6.6, 7.0);
  show($('p1'), t, 7.1, 7.6, 10.6, 11.0);
  show($('p2'), t, 8.0, 8.5, 10.6, 11.0);
  show($('p3'), t, 8.9, 9.4, 10.6, 11.0);
  show($('end'), t, 11.4, 12.2, 99, 100, 120);
};
window.render(0);
</script>
</body>
</html>
